<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USOA GROUP</title>

    <meta name="description"
          content="USOA GROUP - Quality products and services.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">USOA GROUP</div>

    <nav>
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
        <a href="/contact.html">Contact</a>
        <a href="/login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>Welcome to USOA GROUP</h1>

        <p>
            Quality Products. Trusted Service.
        </p>

        <a class="btn" href="/products.html">
            Explore Products
        </a>
    </div>
</section>

<footer>
    © 2026 USOA GROUP. All Rights Reserved.
</footer>

</body>
</html>
